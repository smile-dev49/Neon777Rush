name: Neon777Rush
options:
  bundleIdPrefix: com.neonrush
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Neon777Rush:
    type: application
    platform: iOS
    sources:
      - path: Neon777Rush
        excludes:
          - Libs/**
    resources:
      - path: Neon777Rush/Resources
    entitlements:
      path: Neon777Rush/Neon777Rush.entitlements
    info:
      path: Neon777Rush/Info.plist
      properties:
        CFBundleDisplayName: Neon 777 Rush
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonrush.neon777rush
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        SWIFT_VERSION: "5.0"
